services:
  svc6:
    container_name: ddev-${DDEV_SITENAME}-svc6
    init: true
    image: issue8832-chained-arg-local-tag
    build:
      dockerfile_inline: |
        ARG TAG=3.19
        ARG BASE=alpine:$${TAG}
        FROM $${BASE}
        RUN echo "I am svc6 (build arg feeds a later ARG default)" > /marker.txt
      args:
        TAG: "3.20"
    command: ["sleep", "infinity"]
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
